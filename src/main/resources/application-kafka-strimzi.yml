# In-cluster Strimzi Kafka with a TLS client certificate (KafkaUser named
# after the service id). PEM content is mapped from Secret kafka-client-tls.
# Selected with SPRING_PROFILES_ACTIVE=kafka-strimzi.
spring:
  kafka:
    security:
      protocol: SSL
    ssl:
      key-store-type: PEM
      trust-store-type: PEM
      key-store-certificate-chain: ${KAFKA_TLS_CERT}
      key-store-key: ${KAFKA_TLS_KEY}
      trust-store-certificates: ${KAFKA_TLS_CA}
