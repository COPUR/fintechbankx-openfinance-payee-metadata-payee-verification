plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.3.6'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.enterprise.openfinance'
version = '0.1.0'
description = 'svc-of-payee-verification: Confirmation of Payee decisions for FinTechBankX Open Finance'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core:5.22.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // Spring 6.1+ resolves @PathVariable / @RequestHeader names from parameter metadata.
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.enterprise.openfinance.payeeverification.Application'
    buildInfo()
}

bootJar {
    archiveFileName = 'payee-verification-service.jar'
}

jar {
    enabled = false
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
