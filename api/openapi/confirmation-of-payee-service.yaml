openapi: 3.0.3
info:
  title: Confirmation of Payee Verification Service API
  version: 0.2.0
  description: >-
    API to verify that payee details match the beneficiary account before
    payment initiation. Every decision is recorded (without names) and
    published as OpenFinance.PayeeVerification.VerificationCompleted.v1 (see
    api/asyncapi/svc-of-payee-verification.yaml). The holder name is returned
    only for a CloseMatch. An account that is unknown is reported as Closed.
    A repeated request with the same X-FAPI-Interaction-ID from the same TPP
    returns the stored decision; reusing it for another account is a 409.
servers:
  - url: https://api.example.com/open-finance/v1
paths:
  /confirmation-of-payee/confirmation:
    post:
      summary: Verify payee details
      operationId: confirmPayee
      tags:
        - ConfirmationOfPayee
      security:
        - dpopAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/DPoP'
        - $ref: '#/components/parameters/InteractionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
            examples:
              match:
                value:
                  Data:
                    Identification: AE280330000000123456789
                    SchemeName: IBAN
                    Name: Al Tareq Trading LLC
      responses:
        '200':
          description: Confirmation result
          headers:
            X-FAPI-Interaction-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
              examples:
                exactMatch:
                  value:
                    Data:
                      AccountStatus: Active
                      NameMatched: Match
                      MatchedName: null
                closeMatch:
                  value:
                    Data:
                      AccountStatus: Active
                      NameMatched: CloseMatch
                      MatchedName: Al Tareq Trading LLC
                noMatch:
                  value:
                    Data:
                      AccountStatus: Active
                      NameMatched: NoMatch
                      MatchedName: null
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: X-FAPI-Interaction-ID was already used by this TPP for a different account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    dpopAuth:
      type: http
      scheme: bearer
      bearerFormat: DPoP
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: >-
        DPoP-bound access token (`DPoP <token>`, RFC 9449) issued by the
        fintechbankx realm with svc-of-payee-verification in aud. The TPP is
        identified from the token, never from the body.
    DPoP:
      name: DPoP
      in: header
      required: true
      schema:
        type: string
      description: >-
        DPoP proof JWT (typ dpop+jwt, ES256/PS256/RS256) whose key matches the
        token's cnf.jkt, with htm, htu, iat, a single-use jti and ath.
    InteractionId:
      name: X-FAPI-Interaction-ID
      in: header
      required: true
      schema:
        type: string
      description: >-
        Correlation identifier (at most 128 characters). Also the idempotency
        key of the request within the calling TPP.
  schemas:
    ConfirmationRequest:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - Identification
            - SchemeName
            - Name
          properties:
            Identification:
              type: string
              example: AE280330000000123456789
            SchemeName:
              type: string
              example: IBAN
            Name:
              type: string
              example: Al Tareq Trading LLC
    ConfirmationResponse:
      type: object
      required:
        - Data
      properties:
        Data:
          type: object
          required:
            - AccountStatus
            - NameMatched
          properties:
            AccountStatus:
              type: string
              enum: [Active, Closed, Deceased]
            NameMatched:
              type: string
              enum: [Match, CloseMatch, NoMatch, UnableToCheck]
            MatchedName:
              type: string
              nullable: true
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - interactionId
        - timestamp
      properties:
        code:
          type: string
        message:
          type: string
        interactionId:
          type: string
        timestamp:
          type: string
          format: date-time
