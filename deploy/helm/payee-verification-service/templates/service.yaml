apiVersion: v1
kind: Service
metadata:
  name: {{ include "payee.name" . }}
  namespace: {{ include "payee.namespace" . | quote }}
  labels:
    {{- include "payee.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "payee.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port | int }}
      targetPort: http
    - name: http-management
      port: {{ .Values.service.managementPort | int }}
      targetPort: management
