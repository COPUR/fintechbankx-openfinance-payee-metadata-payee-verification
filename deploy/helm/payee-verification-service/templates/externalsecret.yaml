{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "payee.secretName" . }}
  namespace: {{ include "payee.namespace" . }}
  labels:
    {{- include "payee.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "payee.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.remoteSecretName is required" .Values.externalSecret.remoteSecretName }}
        property: password
---
# Schema owner credential, read only by the migrate init container.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "payee.migrationSecretName" . }}
  namespace: {{ include "payee.namespace" . }}
  labels:
    {{- include "payee.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ include "payee.migrationSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ required "externalSecret.migrationRemoteSecretName is required" .Values.externalSecret.migrationRemoteSecretName }}
        property: password
{{- end }}
