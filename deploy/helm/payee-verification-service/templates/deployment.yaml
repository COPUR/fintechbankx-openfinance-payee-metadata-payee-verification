apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payee.name" . }}
  namespace: {{ include "payee.namespace" . }}
  labels:
    {{- include "payee.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "payee.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "payee.selectorLabels" . | nindent 8 }}
        app: {{ include "payee.name" . }}
        version: {{ .Values.image.tag | quote }}
        fintechbankx.io/service-id: {{ .Values.serviceId }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Changes with the secret references and externalSecret.rotation, so a credential
        # rotation (runbook) rolls the pods onto the new password.
        checksum/secret: {{ include (print $.Template.BasePath "/externalsecret.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
        # 5432: the migrate init container runs before the Istio sidecar exists; Aurora is
        # outside the mesh and reached with TLS (sslmode=require).
        {{- if eq .Values.kafka.profile "kafka-strimzi" }}
        # 9093: Strimzi uses its own mutual TLS; the sidecar must not wrap it.
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432,9093"
        {{- else }}
        traffic.sidecar.istio.io/excludeOutboundPorts: "5432"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "payee.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "payee.selectorLabels" . | nindent 14 }}
      initContainers:
        # Flyway with the schema owner's credential (secret db-migration); exits when the
        # schema is current. The service container below never holds this credential.
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--spring.main.web-application-type=none"]
          envFrom:
            - configMapRef:
                name: {{ include "payee.name" . }}
          env:
            - name: DB_USERNAME
              value: {{ required "migration.username is required" .Values.migration.username | quote }}
            - name: OUTBOX_RELAY_ENABLED
              value: "false"
            - name: TRACING_ENABLED
              value: "false"
            {{- if .Values.externalSecret.enabled }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "payee.migrationSecretName" . }}
                  key: SPRING_DATASOURCE_PASSWORD
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "payee.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: payee-verification-service
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: management
              containerPort: {{ .Values.service.managementPort }}
          env:
            # Migrations ran in the init container; the runtime role owns nothing.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            # Common Micrometer tags app = service account and squad = namespace, as the
            # platform alerts expect (outbox_oldest_pending_age_seconds, outbox_send_failures_total).
            - name: METRICS_APP_TAG
              value: {{ .Values.serviceAccount.name | quote }}
            - name: METRICS_SQUAD_TAG
              value: {{ .Release.Namespace | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.kafka.profile | quote }}
            {{- if eq .Values.kafka.profile "kafka-strimzi" }}
            - name: KAFKA_TLS_CERT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.strimziTlsSecret }}
                  key: user.crt
            - name: KAFKA_TLS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.strimziTlsSecret }}
                  key: user.key
            - name: KAFKA_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafka.strimziTlsSecret }}
                  key: ca.crt
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "payee.name" . }}
            {{- if .Values.externalSecret.enabled }}
            - secretRef:
                name: {{ include "payee.secretName" . }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "payee.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
